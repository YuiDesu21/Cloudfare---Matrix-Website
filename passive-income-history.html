<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Matrix member passive income history">
  <title>Passive Income History | Matrix Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal-body">
  <header class="portal-header site-header">
    <div class="container header-wrapper withdrawal-header-wrapper">
      <a class="brand" href="portal.html"><span class="brand-mark">M</span><span><strong>Matrix</strong><small>Member Finance</small></span></a>
      <div class="user-status-strip" data-member-menu data-current-page="passive-income-history">
        <button class="account-menu-toggle" type="button" aria-label="Open member menu" aria-expanded="false" data-member-menu-toggle>
          <span class="header-avatar" data-member-menu-avatar>M</span>
          <span class="account-menu-copy"><small>Member menu</small><strong data-member-menu-name>Member</strong></span>
          <span class="account-chevron" aria-hidden="true">&#9662;</span>
        </button>
        <nav class="account-menu" aria-label="Member pages" data-member-menu-list hidden></nav>
      </div>
    </div>
  </header>

  <main class="portal-container withdrawal-page">
    <section class="withdrawal-hero">
      <div><span class="withdrawal-eyebrow">Member Finance</span><h1>Passive Income History</h1><p>Review every income entry, its source, due date, amount, and payment status.</p></div>
      <a class="button button-primary button-small" href="withdrawal-request.html">Request Withdrawal</a>
    </section>
    <div id="income-history-alert" class="alert" style="display:none;"></div>
    <section id="income-history-content" style="display:none;">
      <div class="withdrawal-history-summary">
        <article><span>Total Income</span><strong id="income-total">PHP 0</strong></article>
        <article><span>Available / Due</span><strong id="income-due">PHP 0</strong></article>
        <article><span>Upcoming</span><strong id="income-upcoming">PHP 0</strong></article>
      </div>
      <div class="portal-card withdrawal-filters income-history-filters">
        <div class="form-group"><label for="income-time-filter">Time Period</label><select id="income-time-filter" class="form-control"><option value="all">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="year">This year</option></select></div>
        <div class="form-group"><label for="income-status-filter">Status</label><select id="income-status-filter" class="form-control"><option value="all">All statuses</option><option value="due">Available / Due</option><option value="upcoming">Upcoming</option><option value="paid">Paid</option></select></div>
        <div class="form-group"><label for="income-source-filter">Source</label><select id="income-source-filter" class="form-control"><option value="all">All sources</option><option value="entry">Entry Passive</option><option value="exit">Exit Passive</option><option value="matrix">1200 Matrix Income</option><option value="timeline-matrix">Timeline Matrix Income</option></select></div>
        <div id="income-result-count" class="history-result-count"></div>
      </div>
      <div id="income-history-list" class="withdrawal-history-list"></div>
    </section>
  </main>
  <script src="js/runtime-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="matrix-db.js"></script>
  <script src="js/member-navigation.js"></script>
  <script src="js/passive-income-history.js"></script>
</body>
</html>
