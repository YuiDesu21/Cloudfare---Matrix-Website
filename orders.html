<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your Matrix shop and plan orders">
  <title>Orders | Matrix Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
  <script src="js/member-navigation-boot.js"></script>
</head>
<body class="portal-body orders-page">
  <a class="skip-link" href="#orders-main">Skip to orders</a>
  <header class="portal-header site-header">
    <div class="container header-wrapper">
      <a class="brand" href="portal.html"><span class="brand-mark">M</span><span><strong>Matrix</strong><small>Member Portal</small></span></a>
      <div class="user-status-strip" data-member-menu data-current-page="orders">
        <button class="account-menu-toggle" type="button" aria-label="Open member menu" aria-expanded="false" data-member-menu-toggle><span class="header-avatar" data-member-menu-avatar>M</span></button>
        <nav class="account-menu" aria-label="Member pages" data-member-menu-list hidden></nav>
      </div>
    </div>
  </header>
  <main class="portal-container withdrawal-page" id="orders-main">
    <header class="withdrawal-hero">
      <div><span class="withdrawal-eyebrow">Commerce</span><h1>Orders</h1><p>Track purchases from the Shop, Entry Orders, and Product Plus.</p></div>
      <a class="button button-outline button-small" href="shop.html">Shop products</a>
    </header>
    <div id="orders-alert" class="alert alert-danger" role="alert" hidden></div>
    <p id="orders-loading" class="page-loading-status" role="status">Loading orders...</p>
    <section id="orders-content" hidden aria-label="Your orders">
      <div class="orders-summary" aria-label="Order overview">
        <div><span>Total orders</span><strong id="orders-total">0</strong></div>
        <div><span>In progress</span><strong id="orders-active">0</strong></div>
        <div><span>Completed</span><strong id="orders-completed">0</strong></div>
      </div>
      <section class="orders-section" aria-labelledby="orders-heading">
        <div class="orders-section-head"><h2 id="orders-heading">Your orders</h2><span id="orders-count">0 orders</span></div>
        <div class="orders-toolbar">
          <div class="orders-filters" role="group" aria-label="Filter orders">
            <button type="button" data-order-filter="all" aria-pressed="true">All</button>
            <button type="button" data-order-filter="active" aria-pressed="false">In progress</button>
            <button type="button" data-order-filter="completed" aria-pressed="false">Completed</button>
            <button type="button" data-order-filter="cancelled" aria-pressed="false">Cancelled</button>
          </div>
          <label class="orders-search">Search orders<input id="orders-search" class="form-control" type="search" placeholder="Order number or item" autocomplete="off"></label>
        </div>
        <div id="orders-list" class="orders-list" aria-live="polite"></div>
      </section>
    </section>
  </main>
  <script src="js/runtime-config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="matrix-db.js?v=20261006-tiers"></script>
  <script src="js/member-navigation.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
