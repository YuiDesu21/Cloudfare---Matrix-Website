<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Matrix schedule: Exit 5 to Exit 9</title><desc id="desc">A compact summary of unlock requirements, actions, and rewards from Exit 5 through Exit 9.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#052b13"/><stop offset="1" stop-color="#020b05"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffe978"/><stop offset="1" stop-color="#eaa900"/></linearGradient><style>.title{font:900 58px Arial,sans-serif;fill:#122006}.sub{font:700 24px Arial,sans-serif;fill:#24320c}.level{font:900 38px Arial,sans-serif;fill:#06200e}.label{font:800 20px Arial,sans-serif;fill:#ffc91c;letter-spacing:1px}.main{font:700 27px Arial,sans-serif;fill:#fff}.reward{font:700 24px Arial,sans-serif;fill:#e9f2e4}.muted{font:600 21px Arial,sans-serif;fill:#adc0a8}.card{fill:#092815;stroke:#4a6c4c;stroke-width:2}.badge{fill:#22bd62}</style></defs>
  <rect width="1080" height="1350" rx="38" fill="url(#bg)"/><rect x="34" y="34" width="1012" height="132" rx="24" fill="url(#gold)"/><text x="540" y="94" text-anchor="middle" class="title">EXIT 5 TO EXIT 9</text><text x="540" y="136" text-anchor="middle" class="sub">MATRIX POWER REWARD SCHEDULE</text>
