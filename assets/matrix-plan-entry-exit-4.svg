<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Matrix schedule: Entry to Exit 4</title><desc id="desc">A compact summary of unlock requirements, actions, and rewards from Entry through Exit 4.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#052b13"/><stop offset="1" stop-color="#020b05"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffe978"/><stop offset="1" stop-color="#eaa900"/></linearGradient><style>.title{font:900 58px Arial,sans-serif;fill:#122006}.sub{font:700 24px Arial,sans-serif;fill:#dce9d6}.level{font:900 38px Arial,sans-serif;fill:#06200e}.label{font:800 20px Arial,sans-serif;fill:#ffc91c;letter-spacing:1px}.main{font:700 27px Arial,sans-serif;fill:#fff}.reward{font:700 24px Arial,sans-serif;fill:#e9f2e4}.muted{font:600 21px Arial,sans-serif;fill:#adc0a8}.card{fill:#092815;stroke:#4a6c4c;stroke-width:2}.badge{fill:#22bd62}</style></defs>
  <rect width="1080" height="1350" rx="38" fill="url(#bg)"/><rect x="34" y="34" width="1012" height="132" rx="24" fill="url(#gold)"/><text x="540" y="94" text-anchor="middle" class="title">ENTRY TO EXIT 4</text><text x="540" y="136" text-anchor="middle" class="sub" fill="#24320c">MATRIX POWER REWARD SCHEDULE</text>
  <g transform="translate(34 194)"><rect class="card" width="1012" height="206" rx="24"/><rect class="badge" x="18" y="18" width="188" height="170" rx="18"/><text x="112" y="112" text-anchor="middle" class="level">ENTRY</text><text x="236" y="54" class="label">ACTION</text><text x="236" y="91" class="main">PHP 1,200 F3</text><text x="236" y="124" class="muted">PHP 900 held-token + PHP 300 matrix</text><text x="236" y="165" class="reward">Passive: PHP 231 x 3 months (PHP 693 total)</text></g>
  <g transform="translate(34 418)"><rect class="card" width="1012" height="206" rx="24"/><rect class="badge" x="18" y="18" width="188" height="170" rx="18"/><text x="112" y="112" text-anchor="middle" class="level">EXIT 1</text><text x="236" y="49" class="label">UNLOCK / ACTION</text><text x="236" y="84" class="main">3 approved downlines • Re-Stake PHP 900</text><text x="236" y="128" class="reward">Passive PHP 297 x 3 months</text><text x="236" y="166" class="reward">Matrix PHP 100 x 3 months</text></g>
  <g transform="translate(34 642)"><rect class="card" width="1012" height="206" rx="24"/><rect class="badge" x="18" y="18" width="188" height="170" rx="18"/><text x="112" y="112" text-anchor="middle" class="level">EXIT 2</text><text x="236" y="49" class="label">UNLOCK / ACTION</text><text x="236" y="84" class="main">3 at Exit 1 • Buy PHP 1,000</text><text x="236" y="126" class="reward">Passive 330 x 3 • Products Plus 1,020 + 153 x 2</text><text x="236" y="166" class="reward">Matrix PHP 225 x 3 months</text></g>
  <g transform="translate(34 866)"><rect class="card" width="1012" height="206" rx="24"/><rect class="badge" x="18" y="18" width="188" height="170" rx="18"/><text x="112" y="112" text-anchor="middle" class="level">EXIT 3</text><text x="236" y="49" class="label">UNLOCK / ACTION</text><text x="236" y="84" class="main">3 at Exit 2 • Re-Stake PHP 1,000</text><text x="236" y="126" class="reward">Passive 330 x 3 • Products Plus 1,687 + 337.40 x 2</text><text x="236" y="166" class="reward">Matrix PHP 236 x 4 months</text></g>
  <g transform="translate(34 1090)"><rect class="card" width="1012" height="206" rx="24"/><rect class="badge" x="18" y="18" width="188" height="170" rx="18"/><text x="112" y="112" text-anchor="middle" class="level">EXIT 4</text><text x="236" y="49" class="label">UNLOCK / ACTION</text><text x="236" y="84" class="main">3 at Exit 3 • Buy PHP 1,500</text><text x="236" y="126" class="reward">Passive 495 x 3 • Products Plus 1,260 + 315 x 3</text><text x="236" y="166" class="reward">Matrix PHP 243 x 5 months</text></g>
