<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Matrix schedule: Exit 10 to Exit 13</title><desc id="desc">A compact summary of unlock requirements, actions, and rewards from Exit 10 through Exit 13.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#052b13"/><stop offset="1" stop-color="#020b05"/></linearGradient><linearGradient id="gold"><stop stop-color="#ffe978"/><stop offset="1" stop-color="#eaa900"/></linearGradient><style>.title{font:900 58px Arial,sans-serif;fill:#122006}.sub{font:700 24px Arial,sans-serif;fill:#24320c}.level{font:900 35px Arial,sans-serif;fill:#06200e}.label{font:800 20px Arial,sans-serif;fill:#ffc91c;letter-spacing:1px}.main{font:700 27px Arial,sans-serif;fill:#fff}.reward{font:700 24px Arial,sans-serif;fill:#e9f2e4}.muted{font:600 21px Arial,sans-serif;fill:#adc0a8}.card{fill:#092815;stroke:#4a6c4c;stroke-width:2}.badge{fill:#22bd62}</style></defs>
  <rect width="1080" height="1350" rx="38" fill="url(#bg)"/><rect x="34" y="34" width="1012" height="132" rx="24" fill="url(#gold)"/><text x="540" y="94" text-anchor="middle" class="title">EXIT 10 TO EXIT 13</text><text x="540" y="136" text-anchor="middle" class="sub">MATRIX POWER REWARD SCHEDULE</text>
  <g transform="translate(34 200)"><rect class="card" width="1012" height="248" rx="24"/><rect class="badge" x="18" y="18" width="188" height="212" rx="18"/><text x="112" y="137" text-anchor="middle" class="level">EXIT 10</text><text x="236" y="61" class="label">UNLOCK / ACTION</text><text x="236" y="102" class="main">3 at Exit 9 • Buy PHP 10,000</text><text x="236" y="153" class="reward">Passive 4,620 x 3 • Products Plus 1,908 + 1,049.40 x 75</text><text x="236" y="202" class="reward">Matrix PHP 3,936 x 45 months</text></g>
  <g transform="translate(34 472)"><rect class="card" width="1012" height="248" rx="24"/><rect class="badge" x="18" y="18" width="188" height="212" rx="18"/><text x="112" y="137" text-anchor="middle" class="level">EXIT 11</text><text x="236" y="61" class="label">UNLOCK / ACTION</text><text x="236" y="102" class="main">3 at Exit 10 • Re-Stake PHP 10,000</text><text x="236" y="153" class="reward">Passive 5,049 x 3 • Products Plus 1,968 + 1,180.80 x 150</text><text x="236" y="202" class="reward">Matrix PHP 4,723 x 75 months</text></g>
  <g transform="translate(34 744)"><rect class="card" width="1012" height="248" rx="24"/><rect class="badge" x="18" y="18" width="188" height="212" rx="18"/><text x="112" y="137" text-anchor="middle" class="level">EXIT 12</text><text x="236" y="61" class="label">UNLOCK / ACTION</text><text x="236" y="102" class="main">3 at Exit 11 • Buy PHP 20,000</text><text x="236" y="153" class="reward">Passive 11,550 x 3 • Products Plus 2,180 + 1,417 x 250</text><text x="236" y="202" class="reward">Matrix PHP 7,085 x 150 months</text></g>
  <g transform="translate(34 1016)"><rect class="card" width="1012" height="248" rx="24"/><rect class="badge" x="18" y="18" width="188" height="212" rx="18"/><text x="112" y="137" text-anchor="middle" class="level">EXIT 13</text><text x="236" y="61" class="label">UNLOCK / ACTION</text><text x="236" y="102" class="main">3 at Exit 12 • Re-Stake PHP 20,000</text><text x="236" y="153" class="reward">Passive 11,880 x 3 • Products Plus 4,338 + 3,036.60 x 350</text><text x="236" y="202" class="reward">Matrix PHP 9,110 x 350 months</text></g>
  <text x="540" y="1325" text-anchor="middle" class="muted">Amounts shown in Philippine pesos</text>
</svg>
